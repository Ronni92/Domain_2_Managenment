name: Register Pet Microservice

on:
  push:
    paths:
      - 'register-pet/**'
    branches:
      - Test  # o tu rama de trabajo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/register-pet-service ./register-pet

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/register-pet-service

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST_REGISTER_PET }}
          username: ${{ secrets.EC2_USER_REGISTER_PET }}
          key: ${{ secrets.EC2_KEY_REGISTER_PET }}
          script: |
            sudo docker stop register-pet || true
            sudo docker rm register-pet || true
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/register-pet-service
            sudo docker run -d --name register-pet -p 3004:3004 ${{ secrets.DOCKER_USERNAME }}/register-pet-service
